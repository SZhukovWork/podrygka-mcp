[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "podrygka-mcp"
version = "0.1.0"
description = "MCP server for the Podruzhka cosmetics chain (podrygka.ru): live online prices with every discount labelled, stock in the stores of your city, delivery terms, line vs variant ratings and reviews"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "podrygka", "podruzhka", "cosmetics", "price-comparison", "llm-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=2.2,<3",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/SZhukovWork/podrygka-mcp"
Repository = "https://github.com/SZhukovWork/podrygka-mcp"
Issues = "https://github.com/SZhukovWork/podrygka-mcp/issues"
Changelog = "https://github.com/SZhukovWork/podrygka-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
podrygka-mcp = "podrygka_mcp.lazy_stdio:main"

[tool.hatch.build.targets.wheel]
packages = ["src/podrygka_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real podrygka.ru API (deselected unless -m live)"]
addopts = "-m 'not live'"
